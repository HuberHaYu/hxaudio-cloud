# 此文件由 scripts/hxcloud.py build 自动生成，手改会被覆盖。
name: ⭐ 给预设评分
description: 为云端预设打 1–5 星。每个 GitHub 账号对同一预设只计一票，再次提交会覆盖上一票。
title: "[评分] "
labels: ["rating"]
body:
  - type: markdown
    attributes:
      value: 提交后机器人会自动记录评分并关闭此 issue，1–2 分钟内同步到云端目录。
  - type: dropdown
    id: preset
    attributes:
      label: 预设
      options:
        - "dync-bass-hxofficial · HX通用调音 - 动态低频补偿"
        - "k60pro-spk-papershort · Redmi K60 Pro 流行音乐"
        - "k90promax-spk-chaoer2330 · Redmi K90 Pro Max"
        - "mi10ultra-spk-huber · 小米 10 Ultra - 外放特调"
        - "redmi-buds6-pro · Redmi Buds6 Pro"
        - "xiaomi-14-spk · 小米14（Xiaomi 14）"
        - "xiaomi-bt-pocket-spk · 小米随身音箱"
        - "xiaomi14-spk-huberlab-hires · 小米14 - HX官方曲线优化"
        - "xiaomi15-se-spk · 小米15/15Pro"
        - "xiaomi15pro-spk-hxj · 小米 15 Pro 浑厚人声"
        - "xiaomi15pro-ttzkyz · 小米 15 Pro杜比全景哈曼卡顿音效"
    validations:
      required: true
  - type: dropdown
    id: score
    attributes:
      label: 评分
      options:
        - "5 ★★★★★"
        - "4 ★★★★"
        - "3 ★★★"
        - "2 ★★"
        - "1 ★"
    validations:
      required: true
