name: 构建目录

# presets/ 或配置有改动时：校验全部预设 → 重新生成 api/v1/* 与评分表单 → 签名 → 自动提交。
# 别人提交的 PR 只做校验，不写仓库。
on:
  push:
    branches: [main]
    paths:
      - "presets/**"
      - "ratings/**"
      - "api/**"
      - "keys/**"
      - "cloud.config.json"
      - "scripts/**"
      - ".github/workflows/build-index.yml"
  pull_request:
    paths:
      - "presets/**"
      - "cloud.config.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        # 不使用 actions/checkout：仓库只允许本地 action（Settings → Actions → local only）。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: python3 scripts/hxcloud.py validate

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        # 不使用 actions/checkout：仓库只允许本地 action（Settings → Actions → local only）。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: 刷新本次推送改动过的预设文件的 CDN 缓存
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          bash scripts/purge_cdn.sh "$GITHUB_REF_NAME" $(git diff --name-only "$BEFORE" "$AFTER" -- presets)
      - name: 校验、重建并签名 api/v1
        env:
          HXCLOUD_SIGNING_KEY: ${{ secrets.HXCLOUD_SIGNING_KEY }}
        run: |
          bash scripts/ci_commit.sh "chore: 重建云端目录" python3 scripts/hxcloud.py build
